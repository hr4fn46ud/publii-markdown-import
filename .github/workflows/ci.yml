name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Run core tests
        run: npm test
      - name: Check translation catalogs, version stamps, and build tests
        run: |
          python3 build.py --check-locales
          python3 build.py --check-versions
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install Playwright with headless Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Run browser interface tests
        run: npm run test:browser
      - name: Build and validate packages
        run: python3 build.py
      - name: Upload packages and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: markdown-importer-packages
          path: dist/*
          if-no-files-found: error

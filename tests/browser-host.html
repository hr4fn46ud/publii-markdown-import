<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Publii bridge test fixture</title><style>body{margin:0}iframe{border:0;width:100%;height:100vh}</style></head><body>
<div id="app"></div><iframe title="Markdown Importer" src="../markdown-importer/options/index.html"></iframe>
<script>
window.testRequests = [];
window.testXss = false;
const currentSite = {config:{name:'Test Website'},posts:[],authors:[{id:1,name:'Test Author'}],themeSettings:{postConfig:[]}};
const store = {state:{currentSite},commit(name,data){currentSite.posts=data.posts;}};
const localeWatchers = new Set();
let locale = new URLSearchParams(location.search).get('locale') || 'en-US';
const hostI18n = {};
Object.defineProperty(hostI18n, 'locale', {
  get(){return locale;},
  set(value){locale=value;localeWatchers.forEach(fn=>fn(value));}
});
document.getElementById('app').__vue__ = {
  $store:store,
  $i18n:hostI18n,
  $watch(expression,callback){
    if(expression!=='$i18n.locale')throw new Error('Unexpected watcher expression');
    localeWatchers.add(callback);return ()=>localeWatchers.delete(callback);
  }
};
window.setTestLocale=value=>{hostI18n.locale=value;};
let savedListener;
window.mainProcessAPI = {
  invoke: async (channel,text)=>text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
  receiveOnce(channel,cb){savedListener=cb;},
  send(channel,data){
    testRequests.push(data);
    const response={postID:testRequests.length,posts:[...currentSite.posts,{id:testRequests.length,slug:data.slug}],tags:[],postsTags:[],postsAuthors:[],authors:currentSite.authors};
    setTimeout(()=>savedListener(response),5);
  }
};
</script></body></html>
